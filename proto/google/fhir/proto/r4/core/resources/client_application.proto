// <SUPERPOWER.COM ADDITION>
//
// This is a custom proto for the ClientApplication resource that Medplum uses.
// See https://www.medplum.com/docs/api/fhir/medplum/clientapplication for more details.

syntax = "proto3";

package google.fhir.r4.core;

import "google/protobuf/any.proto";
import "proto/google/fhir/proto/annotations.proto";
import "proto/google/fhir/proto/r4/core/datatypes.proto";

option java_multiple_files = true;
option java_package = "com.google.fhir.r4.core";
option (.google.fhir.proto.fhir_version) = R4;
option go_package = "github.com/superpowerdotcom/fhir/go/proto/google/fhir/proto/r4/core/resources/client_application_go_proto";

// Custom enum for ClientApplication status codes as defined in Medplum documentation
// See https://www.medplum.com/docs/api/fhir/medplum/clientapplication
message ClientApplicationStatusCode {
  enum Value {
    INVALID_UNINITIALIZED = 0;
    ACTIVE = 1;
    ERROR = 2;
    OFF = 3;
  }
}

message ClientApplication {
  option (.google.fhir.proto.structure_definition_kind) = KIND_RESOURCE;
  option (.google.fhir.proto.fhir_structure_definition_url) =
      "http://hl7.org/fhir/StructureDefinition/ClientApplication";

  // The logical id of the resource, as used in the URL for the resource. Once assigned, this value never changes.
  Id id = 1;

  // The metadata about the resource. This is content that is maintained by the infrastructure. Changes to the content might not always be associated with version changes to the resource.
  Meta meta = 2;

  // A reference to a set of rules that were followed when the resource was constructed, and which must be understood when processing the content. Often, this is a reference to an implementation guide that defines the special rules along with other profiles etc.
  Uri implicit_rules = 3;

  // The base language in which the resource is written.
  Code language = 4;

  // A human-readable narrative that contains a summary of the resource and can be used to represent the content of the resource to a human. The narrative need not encode all the structured data, but is required to contain sufficient detail to make it "clinically safe" for a human to just read the narrative. Resource definitions may define what content should be represented in the narrative to ensure clinical safety.
  Narrative text = 5;

  // Contained, inline Resources
  repeated protobuf.Any contained = 6;

  // Field 7 reserved for strongly-typed ContainedResource for id:
  // ClientApplication.contained
  reserved 7;

  // Additional content defined by implementations
  repeated Extension extension = 8;

  // Extensions that cannot be ignored
  repeated Extension modifier_extension = 9;

  // Status of the client application: active | error | off
  // Exactly as defined in Medplum ClientApplication specification
  message StatusCode {
    option (.google.fhir.proto.structure_definition_kind) = KIND_PRIMITIVE_TYPE;
    option (.google.fhir.proto.fhir_profile_base) =
        "http://medplum.com/fhir/StructureDefinition/code";

    ClientApplicationStatusCode.Value value = 1;

    String id = 2;

    repeated Extension extension = 3;
  }
  StatusCode status = 10;

  // The name of the client application
  String name = 11;

  // Description of the client application
  String description = 12;

  // Sign-in form configuration with welcome string and logo
  message SignInForm {
    // Welcome string for the Log In Form
    String welcome_string = 1;

    // Logo for the Log In Form
    Attachment logo = 2;
  }
  SignInForm sign_in_form = 13;

  // Secret key for the client application
  String secret = 14;

  // Retiring secret key for the client application
  String retiring_secret = 15;

  // URI for JSON Web Key Set
  Uri jwks_uri = 16;

  // Redirect URI for OAuth2 flows
  Uri redirect_uri = 17;

  // Launch URI for SMART App Launch
  Uri launch_uri = 18;

  // Whether PKCE is optional for this client
  Boolean pkce_optional = 19;

  // TODO: Define protos for IdentityProvider (Currently being unused at the moment)
  // Reference identity_provider = 20 [(.google.fhir.proto.valid_reference_type) = "IdentityProvider"];

  // Access token lifetime
  String access_token_lifetime = 21;

  // Refresh token lifetime
  String refresh_token_lifetime = 22;

  // Allowed origins for CORS
  repeated String allowed_origin = 23;

  // Default scopes for this client application
  repeated String default_scope = 24;
}
