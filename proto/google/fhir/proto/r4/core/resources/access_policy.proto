// <SUPERPOWER.COM ADDITION>
//
// This is a custom proto for the AccessPolicy resource that Medplum uses.
// See https://www.medplum.com/docs/api/fhir/medplum/accesspolicy for more details.

syntax = "proto3";

package google.fhir.r4.core;

import "google/protobuf/any.proto";
import "proto/google/fhir/proto/annotations.proto";
import "proto/google/fhir/proto/r4/core/datatypes.proto";

option java_multiple_files = true;
option java_package = "com.google.fhir.r4.core";
option (.google.fhir.proto.fhir_version) = R4;
option go_package = "github.com/superpowerdotcom/fhir/go/proto/google/fhir/proto/r4/core/resources/access_policy_go_proto";

message AccessPolicy {
  option (.google.fhir.proto.structure_definition_kind) = KIND_RESOURCE;
  option (.google.fhir.proto.fhir_structure_definition_url) =
      "http://hl7.org/fhir/StructureDefinition/AccessPolicy";

  // The logical id of the resource, as used in the URL for the resource. Once assigned, this value never changes.
  Id id = 1;

  // The metadata about the resource. This is content that is maintained by the infrastructure. Changes to the content might not always be associated with version changes to the resource.
  Meta meta = 2;

  // A reference to a set of rules that were followed when the resource was constructed, and which must be understood when processing the content. Often, this is a reference to an implementation guide that defines the special rules along with other profiles etc.
  Uri implicit_rules = 3;

  // The base language in which the resource is written.
  Code language = 4;

  // A human-readable narrative that contains a summary of the resource and can be used to represent the content of the resource to a human. The narrative need not encode all the structured data, but is required to contain sufficient detail to make it "clinically safe" for a human to just read the narrative. Resource definitions may define what content should be represented in the narrative to ensure clinical safety.
  Narrative text = 5;

  // Contained, inline Resources
  repeated protobuf.Any contained = 6;

  // Field 7 reserved for strongly-typed ContainedResource for id:
  // AccessPolicy.contained
  reserved 7;

  // Additional content defined by implementations
  repeated Extension extension = 8;

  // Extensions that cannot be ignored
  repeated Extension modifier_extension = 9;

  // A name associated with the AccessPolicy.
  String name = 10;

  // Other access policies used to derive this access policy.
  repeated Reference based_on = 11 [(.google.fhir.proto.valid_reference_type) = "AccessPolicy"];

  // Optional compartment for newly created resources. If this field is set, any resources created by a user with this access policy will automatically be included in the specified compartment.
  Reference compartment = 12 [(.google.fhir.proto.valid_reference_type) = "Resource"];

  // Access details for a resource type.
  repeated Resource resource = 13;

  // Use IP Access Rules to allowlist, block, and challenge traffic based on the visitor IP address.
  repeated IPAccessRule ip_access_rule = 14;

  message Resource {
    // The resource type.
    String resource_type = 1 [(.google.fhir.proto.validation_requirement) = REQUIRED_BY_FHIR];

    // @deprecated Optional compartment restriction for the resource type.
    Reference compartment = 2 [(.google.fhir.proto.valid_reference_type) = "Resource"];

    // The rules that the server should use to determine which resources to allow.
    // The rules are search criteria (without the [base] part). Like Bundle.entry.request.url, it has no leading "/".
    String criteria = 3;

    // @deprecated Use AccessPolicy.resource.interaction = ['search', 'read', 'vread', 'history']
    Boolean readonly = 4;

    // Permitted FHIR interactions with this resource type
    repeated Code interaction = 5;

    // Optional list of hidden fields. Hidden fields are not readable or writeable.
    repeated String hidden_fields = 6;

    // Optional list of read-only fields. Read-only fields are readable but not writeable.
    repeated String readonly_fields = 7;

    // Invariants that must be satisfied for the resource to be written. Can include %before and %after placeholders to refer to the resource before and after the updates are applied.
    repeated Expression write_constraint = 8;
  }

  message IPAccessRule {
    // Friendly name that will make it easy for you to identify the IP Access Rule in the future.
    String name = 1;

    // An IP Access rule will apply a certain action to incoming traffic based on the visitor IP address or IP range.
    String value = 2 [(.google.fhir.proto.validation_requirement) = REQUIRED_BY_FHIR];

    // Access rule can perform one of the following actions: "allow" | "block".
    Code action = 3 [(.google.fhir.proto.validation_requirement) = REQUIRED_BY_FHIR];
  }
}
