name: superpowerdotcom/fhir/go - Release

on:
  push:
    branches:
      - main

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, 'norelease') }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '~1.22'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Optional: run tests
      # - name: Test
      #   run: go test ./... -v

      - name: Get short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create tag
        uses: mathieudutour/github-tag-action@v6.1
        id: create_tag
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fetch_all_tags: true
          tag_prefix: "go/v"

      - name: Set VERSION
        id: version
        run: echo "version=${{ steps.create_tag.outputs.new_tag }}-${{ steps.vars.outputs.short_sha }}" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.create_tag.outputs.new_tag }}
          body: |
            ## Superpower FHIR Go Protobuf Bindings

            ### Installation
            ```bash
            go get github.com/superpowerdotcom/fhir/go@${{ steps.create_tag.outputs.new_tag }}
            ```

            ### Usage
            ```go
            import (
                "github.com/superpowerdotcom/fhir/go/proto/google/fhir/proto/r4/core/profiles/datatypes_go_proto"
            )
            ```
            Auto-generated release from main branch.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
