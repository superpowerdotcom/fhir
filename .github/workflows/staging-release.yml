name: superpowerdotcom/fhir/go - Staging Release

on:
  workflow_dispatch:
    inputs:
      prerelease_type:
        description: 'Pre-release type'
        required: true
        default: 'beta'
        type: choice
        options:
        - beta
        - alpha
        - rc
      version_increment:
        description: 'Version increment'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

jobs:
  staging-release:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '~1.26'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Go for private modules
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GOPRIVATE=github.com/superpowerdotcom/*" >> $GITHUB_ENV
          git config --global url."https://${GH_TOKEN}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Test Go modules
        run: |
          cd go
          go test ./... -v

      - name: Get latest tag
        id: get_latest_tag
        run: |
          git fetch --tags
          # Get the latest tag with go/v prefix, excluding pre-releases
          LATEST_TAG=$(git tag -l "go/v*" | grep -v '-' | sort -V | tail -1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="go/v0.0.0"
          fi
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest stable tag: $LATEST_TAG"

      - name: Calculate next version
        id: next_version
        env:
          LATEST_TAG: ${{ steps.get_latest_tag.outputs.latest_tag }}
          VERSION_INCREMENT: ${{ inputs.version_increment }}
          PRERELEASE_TYPE: ${{ inputs.prerelease_type }}
        run: |
          # Validate before Bash arithmetic: tag values must never become code.
          if [[ ! "$LATEST_TAG" =~ ^go/v(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$ ]]; then
            echo "Invalid stable Go version tag" >&2
            exit 1
          fi
          case "$VERSION_INCREMENT" in
            major|minor|patch) ;;
            *) echo "Invalid version increment" >&2; exit 1 ;;
          esac
          case "$PRERELEASE_TYPE" in
            alpha|beta|rc) ;;
            *) echo "Invalid pre-release type" >&2; exit 1 ;;
          esac
          
          # Remove 'go/v' prefix
          VERSION=${LATEST_TAG#go/v}
          
          # Split version into major, minor, patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # Remove any existing pre-release suffix from patch
          PATCH=${PATCH%%-*}
          
          # Increment version based on input
          case $VERSION_INCREMENT in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          # Generate timestamp for uniqueness
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          
          # Create new pre-release version with go/v prefix
          NEW_VERSION="go/v${MAJOR}.${MINOR}.${PATCH}-${PRERELEASE_TYPE}.${TIMESTAMP}"
          
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Next version: $NEW_VERSION"

      - name: Get short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create staging tag
        env:
          NEW_VERSION: ${{ steps.next_version.outputs.new_version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -a "$NEW_VERSION" -m "Staging release $NEW_VERSION from $REF_NAME"
          git push origin "$NEW_VERSION"

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.next_version.outputs.new_version }}
          name: 🧪 Staging Release ${{ steps.next_version.outputs.new_version }}
          body: |
            ## 🧪 Superpower FHIR Go Protobuf Bindings - Staging Release
            
            **⚠️ This is a pre-release version for testing purposes and should not be used in production.**
            
            ### Changes
            - **Branch:** `${{ github.ref_name }}`
            - **Commit:** `${{ github.sha }}`
            - **Short SHA:** `${{ steps.vars.outputs.short_sha }}`
            - **Pre-release type:** `${{ inputs.prerelease_type }}`
            - **Version increment:** `${{ inputs.version_increment }}`
            
            ### Installation
            ```bash
            go get github.com/superpowerdotcom/fhir/go@${{ steps.next_version.outputs.new_version }}
            ```
            
            ### Usage
            ```go
            import (
                "github.com/superpowerdotcom/fhir/go/proto/google/fhir/proto/r4/core/profiles/datatypes_go_proto"
            )
            ```
            
            ### Testing This Release
            To test this staging release in your project:
            
            1. **Update your go.mod:**
               ```bash
               go get github.com/superpowerdotcom/fhir/go@${{ steps.next_version.outputs.new_version }}
               ```
            
            2. **Or use go mod edit:**
               ```bash
               go mod edit -require=github.com/superpowerdotcom/fhir/go@${{ steps.next_version.outputs.new_version }}
               go mod download
               ```
            
            3. **Revert to stable version when done testing:**
               ```bash
               go get github.com/superpowerdotcom/fhir/go@latest
               ```
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        env:
          NEW_VERSION: ${{ steps.next_version.outputs.new_version }}
          REF_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
          PRERELEASE_TYPE: ${{ inputs.prerelease_type }}
          VERSION_INCREMENT: ${{ inputs.version_increment }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "## 🎉 Staging Release Created!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${NEW_VERSION}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${SHORT_SHA}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** \`${PRERELEASE_TYPE}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Increment:** \`${VERSION_INCREMENT}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Installation:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "go get github.com/superpowerdotcom/fhir/go@${NEW_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links:" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Release](https://github.com/${REPOSITORY}/releases/tag/${NEW_VERSION})" >> $GITHUB_STEP_SUMMARY
          echo "- [Go Package](https://pkg.go.dev/github.com/superpowerdotcom/fhir/go@${NEW_VERSION})" >> $GITHUB_STEP_SUMMARY 